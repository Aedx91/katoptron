name: PR title check

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: A fix needs a test
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          node -e '
            const { execFileSync } = require("node:child_process");
            const title = (process.env.PR_TITLE || "").trim();
            if (!/^fix(?:\(|:)/i.test(title)) {
              console.log(`pr-title ok: "${title}" is not fix( or fix:; test file check skipped`);
              process.exit(0);
            }
            const out = execFileSync("git", ["diff", "--name-status", "--no-renames", "-z", `origin/${process.env.BASE_REF}...HEAD`], { encoding: "utf8" });
            const fields = out.split("\0");
            const isTest = (p) =>
              /(^|\/)test_[^/]*\.py$/.test(p) ||
              /[^/]+\.(?:test|spec)\.[cm]?[jt]sx?$/.test(p) ||
              /(^|\/)(?:tests|__tests__|test|Tests)\/.+/.test(p) ||
              /_test\.dart$/.test(p) ||
              /(?:Test|Tests|Spec)\.(?:kt|java|cs|lua|luau)$/.test(p);
            for (let i = 0; i + 1 < fields.length; i += 2) {
              const st = fields[i].trim().charAt(0);
              const fp = fields[i + 1];
              if (fp && (st === "A" || st === "M" || st === "T") && isTest(fp)) {
                console.log(`pr-title ok: fix PR includes test file ${fp}`);
                process.exit(0);
              }
            }
            console.error(`FAIL: PR title "${title}" starts with fix( or fix: but adds or modifies no test file.`);
            process.exit(1);
          '
